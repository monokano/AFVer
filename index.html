<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFVer-Web — Adobe File Version</title>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #252526;
    --row-alt: #2a2a2b;
    --border: #3a3a3c;
    --text: #e4e4e6;
    --text-dim: #8a8a8e;
    --accent: #0a84ff;
    --warning: #6b6b6e;
    --mismatch: #ff453a;
    --header-bg: #2d2d30;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f5f7;
      --panel: #ffffff;
      --row-alt: #f0f0f2;
      --border: #d8d8dc;
      --text: #1d1d1f;
      --text-dim: #86868b;
      --accent: #0071e3;
      --warning: #a0a0a4;
      --mismatch: #d70015;
      --header-bg: #ececee;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  header .sub { font-size: 11px; color: var(--text-dim); }
  header .spacer { flex: 1; }
  header button {
    font-size: 12px; padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    cursor: pointer; white-space: nowrap;
  }
  header button:hover:not(:disabled) { background: var(--header-bg); }
  header button:disabled { opacity: .4; cursor: default; }

  #main { flex: 1; position: relative; overflow: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--header-bg); text-align: left;
    padding: 7px 12px; font-weight: 600; font-size: 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th .arrow { color: var(--text-dim); font-size: 10px; margin-left: 4px; }
  tbody td { padding: 6px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; max-width: 0; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr.dim td { color: var(--warning); }
  tbody tr td.mismatch { color: var(--mismatch); }
  td.col-name { width: 45%; }
  td.col-ver  { width: 22%; }
  .vdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .vdot.ai { background: #FF9A00; }   /* Illustrator */
  .vdot.ps { background: #31A8FF; }   /* Photoshop */
  .vdot.id { background: #FF3366; }   /* InDesign */
  .vdot.pdf { background: #8a8f98; }  /* PDF（native data 有無に関わらずグレー） */
  .vdot.eps-other { background: transparent; border: 1.5px solid #8a8f98; box-sizing: border-box; }  /* generic EPS（中空リング・PDFの塗り●と区別） */
  td.col-kind { width: 33%; }
  .badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px;
    margin-right: 6px; vertical-align: middle; font-weight: 600;
  }
  .badge.ai     { background: #ff9a00; color: #1a1a00; }
  .badge.id     { background: #ff2d92; color: #ffffff; }
  .badge.ps     { background: #31a8ff; color: #ffffff; }
  .badge.pdf    { background: #ffffff; color: #e2231a; border: 1px solid #e2231a; }
  .badge.eps-ai { background: #ff9a00; color: #000000; } /* Illustrator EPS */
  .badge.eps-ps { background: #31a8ff; color: #ffffff; } /* Photoshop EPS */
  .badge.eps-other { background: #ffffff; color: #444444; border: 1px solid #aaaaaa; } /* generic EPS */
  .badge.none   { background: var(--border); color: var(--text-dim); }

  /* 書類（ファイル）アイコン表示：やや縦長の矩形タイル＋中央にアプリ略号 */
  .ficon {
    display: inline-flex; align-items: center; justify-content: center;
    box-sizing: border-box; width: 14px; height: 18px;
    margin-right: 6px; vertical-align: -2px; border-radius: 2px;
    font-size: 8px; font-weight: 800; letter-spacing: -.3px; line-height: 1;
    color: #ffffff;
    position: relative; top: -2px;   /* アイコンを行内で2px上へ */
  }
  .ficon::after { content: attr(data-lbl); }
  .ficon.ai     { background: #330000; color: #ffb84d; font-size: 10px; } /* Illustrator */
  .ficon.id     { background: #330033; color: #ff6b8f; font-size: 10px; } /* InDesign */
  .ficon.ps     { background: #001e36; color: #6cc4ff; font-size: 10px; } /* Photoshop */
  .ficon.pdf    { background: #ffffff; color: #e2231a; border: 1px solid #e2231a; font-size: 6px; } /* 白地・赤囲み・赤文字 */
  .ficon.eps-ai { background: #ffffff; color: #444444; border: 1px solid #aaaaaa; font-size: 10px; } /* Illustrator EPS */
  .ficon.eps-ps { background: #ffffff; color: #444444; border: 1px solid #aaaaaa; font-size: 10px; } /* Photoshop EPS */
  .ficon.eps-ai::after { content: "Ai"; } /* data-lbl（"EPS"）を上書き */
  .ficon.eps-ps::after { content: "Ps"; } /* data-lbl（"EPS"）を上書き */
  .ficon.eps-other { background: #ffffff; color: #444444; border: 1px solid #aaaaaa; } /* generic EPS（白地・グレー囲み・"EPS"） */
  .ficon.none   { background: #b0b0b0; }                                  /* 非対応・グレー */
  /* ファイルアイコン表示時のみ、ファイル名を下げてアイコンと高さを揃える（アイコンと合わせて全体を2px上げ済み） */
  #tbody.icons-file .fname { position: relative; top: 2px; }

  tbody tr.dir { cursor: pointer; user-select: none; }
  tbody tr.dir:hover td { background: var(--header-bg); }
  tbody tr.dir td.col-name { font-weight: 600; }
  .tw { display: inline-block; width: 14px; text-align: center; color: var(--text-dim); font-size: 10px; }
  .folder-icon { margin-right: 5px; }


  #placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); font-size: 14px; pointer-events: none; text-align: center; padding: 20px;
  }
  #placeholder small { display:block; margin-top: 8px; font-size: 12px; opacity: .8; }

  #drop-overlay {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center;
    background: rgba(10,132,255,.08);
    border: 3px dashed var(--accent); border-radius: 12px; margin: 8px;
    font-size: 18px; color: var(--accent); font-weight: 600; pointer-events: none;
  }
  body.dragover #drop-overlay { display: flex; }

  footer {
    padding: 6px 16px; font-size: 11px; color: var(--text-dim);
    border-top: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
    display: flex; gap: 16px; align-items: center;
  }
  .detail-toggle { display: inline-flex; align-items: center; gap: 6px; }
  .detail-toggle .seg-label { opacity: .7; }
  .detail-toggle .seg-group { display: inline-flex; }
  .detail-toggle .seg {
    border: 1px solid var(--border); background: none; color: var(--text-dim);
    font: inherit; font-size: 11px; line-height: 1.7; padding: 0 8px; cursor: pointer;
  }
  .detail-toggle .seg-group .seg:first-child { border-radius: 5px 0 0 5px; }
  .detail-toggle .seg-group .seg:last-child { border-radius: 0 5px 5px 0; border-left: none; }
  .detail-toggle .seg.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 「開く」メニュー */
  .menu-wrap { position: relative; display: inline-block; }
  .menu {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.25); padding: 4px; min-width: 170px;
  }
  .menu[hidden] { display: none; }
  .menu button {
    display: block; width: 100%; text-align: left; border: none; background: none;
    color: var(--text); padding: 7px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .menu button:hover { background: var(--header-bg); }

  .badge, .ficon, .ficon::before, .ficon::after, .vdot { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print-title { display: none; }

  #notice {
    padding: 8px 16px; font-size: 12px; line-height: 1.55; flex-shrink: 0;
    background: #4a3a00; color: #ffd479; border-bottom: 1px solid var(--border);
  }
  #notice[hidden] { display: none; }
  @media (prefers-color-scheme: light) { #notice { background: #fff3cd; color: #7a5c00; } }
  @media print { #notice { display: none !important; } }

  @media print {
    header, footer, #drop-overlay, #placeholder { display: none !important; }
    body { height: auto; overflow: visible; background: #fff; color: #000; }
    #main { overflow: visible; }
    thead th { cursor: default; background: #ececec !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tbody tr.dir td { background: #f3f3f3 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tbody tr:nth-child(even) { background: #fafafa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tbody tr.dim td { color: #888 !important; -webkit-print-color-adjust: exact; }
    #print-title { display: block !important; padding: 4px 0 12px; }
    #print-title h2 { margin: 0 0 2px; font-size: 16px; }
    #print-title .pt-date { font-size: 11px; color: #555; }
  }
</style>
</head>
<body>
<header>
  <h1>AFVer-Web</h1>
  <span class="sub">Illustrator / InDesign ファイルの作成バージョンを検出</span>
  <span class="spacer"></span>
  <div class="menu-wrap">
    <button id="btn-open">開く…</button>
    <div id="open-menu" class="menu" hidden>
      <button id="mi-file">ファイルを選択…</button>
      <button id="mi-folder">フォルダを選択…</button>
    </div>
  </div>
  <button id="btn-iconstyle" title="アイコン表示を切り替え">アイコン: ファイル</button>
  <button id="btn-expand" disabled>全て展開</button>
  <button id="btn-collapse" disabled>全て折りたたむ</button>
  <button id="btn-print" disabled>印刷 / PDF</button>
  <button id="btn-clear" disabled>クリア</button>
</header>

<div id="notice" hidden></div>

<div id="main">
  <div id="print-title"></div>
  <table>
    <thead>
      <tr>
        <th data-key="name">ファイル名<span class="arrow"></span></th>
        <th data-key="ver">バージョン<span class="arrow"></span></th>
        <th data-key="kind">種類<span class="arrow"></span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="placeholder">
    ここにファイルやフォルダをドロップ
    <small>.ai / .ait / .eps / .pdf / .indd / .indt / .indb / .indl / .idml</small>
  </div>
</div>

<footer>
  <span>すべてブラウザ内で処理され、ファイルはどこにも送信されません。</span>
  <span class="spacer" style="flex:1"></span>
  <span class="detail-toggle" title="詳細＝x.x.x ／ 簡易＝x.x">
    <span class="seg-label">精度</span><span class="seg-group"><button type="button" id="detail-full" class="seg">詳細</button><button type="button" id="detail-simple" class="seg">簡易</button></span>
  </span>
  <a href="https://github.com/monokano/AFVer/releases" target="_blank" rel="noopener"
     style="color:inherit;text-decoration:none;opacity:.6;" id="ver-link">v1.11</a>
</footer>

<div id="drop-overlay">ドロップして検出</div>

<input type="file" id="file-input" multiple style="display:none"
       accept=".ai,.ait,.eps,.pdf,.psd,.psb,.indd,.indt,.indb,.indl,.idml">
<input type="file" id="folder-input" webkitdirectory multiple style="display:none">

<script>
"use strict";

/* ============================================================================
 * AFVer-Web — File Ver Ai / File Ver Id 統合 Web版
 *   Swift 版（FileParser.swift 両アプリ）のロジックを忠実に移植。
 *   外部ライブラリ不使用。zlib/ZIP 展開はブラウザ標準 DecompressionStream を使用。
 *   macOS の Finder Info（xattr）はブラウザで取得不可のためコンテンツ判定のみ。
 * ==========================================================================*/

/* ---------------------------------------------------------------------------
 * バイト列ユーティリティ
 * -------------------------------------------------------------------------*/

// ASCII/Latin1 文字列を Uint8Array に（マーカー定義用）
function b(str) { return Uint8Array.from(str, c => c.charCodeAt(0) & 0xff); }

// data[start, end) を Latin1 文字列にデコード（バイト⇔charCode 1:1、ASCII領域は厳密一致）
function latin1(data, start = 0, end = data.length) {
  if (start < 0) start = 0;
  if (end > data.length) end = data.length;
  let s = ""; const CH = 8192;
  for (let i = start; i < end; i += CH) {
    s += String.fromCharCode.apply(null, data.subarray(i, Math.min(end, i + CH)));
  }
  return s;
}

// data[start, end) を UTF-8 でデコード（不正時は Latin1 にフォールバック）
const _utf8Strict = new TextDecoder("utf-8", { fatal: true });
function utf8(data, start, end) {
  const sub = data.subarray(start, end);
  try { return _utf8Strict.decode(sub); }
  catch { return latin1(data, start, end); }
}

// needle(配列/Uint8Array) を data[start, limit) から検索。見つからなければ -1。
function indexOf(data, needle, start = 0, limit = data.length) {
  const nlen = needle.length;
  if (nlen === 0) return start;
  const last = Math.min(limit, data.length) - nlen;
  outer:
  for (let i = start; i <= last; i++) {
    for (let j = 0; j < nlen; j++) if (data[i + j] !== needle[j]) continue outer;
    return i;
  }
  return -1;
}

function startsWith(data, pos, needle) {
  if (pos + needle.length > data.length) return false;
  for (let j = 0; j < needle.length; j++) if (data[pos + j] !== needle[j]) return false;
  return true;
}

function arraysEqual(a, bb) {
  if (a.length !== bb.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== bb[i]) return false;
  return true;
}

function readU16LE(d, i) { return (d[i] | (d[i + 1] << 8)) >>> 0; }
function readU32LE(d, i) { return (d[i] | (d[i + 1] << 8) | (d[i + 2] << 16) | (d[i + 3] << 24)) >>> 0; }

function extOf(name) {
  const i = name.lastIndexOf(".");
  return i < 0 ? "" : name.slice(i + 1).toLowerCase();
}

/* ---------------------------------------------------------------------------
 * zlib / deflate 展開（DecompressionStream）
 *   raw=false → zlib (RFC1950, 'deflate')   raw=true → 生deflate ('deflate-raw')
 * -------------------------------------------------------------------------*/
async function inflate(bytes, raw) {
  try {
    const ds = new DecompressionStream(raw ? "deflate-raw" : "deflate");
    const writer = ds.writable.getWriter();
    writer.write(bytes);
    writer.close();
    const reader = ds.readable.getReader();
    const chunks = []; let total = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); total += value.length;
    }
    const out = new Uint8Array(total); let off = 0;
    for (const c of chunks) { out.set(c, off); off += c.length; }
    return out;
  } catch (e) {
    return null;
  }
}

/* ===========================================================================
 *  Illustrator / Photoshop パーサー（File Ver Ai 移植）
 * ==========================================================================*/

const Ai = (() => {
  const markerCreator = b("%%Creator: ");
  const markerAI8     = b("%%AI8_CreatorVersion: ");
  const markerBeginData = b("%%BeginData:");

  // --- 種別判定の補助 ---

  function isPDFBased(data) {
    return startsWith(data, 0, b("%PDF-"));
  }
  function isAIPDFFormat(data) { // Illustrator編集機能保持PDF（.ai偽装検出）
    return indexOf(data, b("/AIPDFPrivateData"), 0, Math.min(data.length, 65536)) >= 0;
  }
  function isIllustratorTemplateFormat(data) { // 本物の .ait か
    return indexOf(data, b("application/vnd.adobe.illustrator"), 0, Math.min(data.length, 2048)) >= 0;
  }

  // バイナリEPS（C5 D0 D3 C6）はPS部分へシークして、その先頭を返す
  function epsReadPSHeader(data, length) {
    let base = 0;
    if (data.length >= 8 && data[0] === 0xC5 && data[1] === 0xD0 && data[2] === 0xD3 && data[3] === 0xC6) {
      base = (data[4] | (data[5] << 8) | (data[6] << 16) | (data[7] << 24)) >>> 0;
    }
    return latin1(data, base, Math.min(data.length, base + length));
  }
  // EPS の PS ヘッダ（先頭16KB）から %%Creator 行の値を抽出（生成元の表示用）。
  // 例: "%%Creator: GPL Ghostscript 923 (eps2write)" → "GPL Ghostscript 923 (eps2write)"
  function epsCreatorLine(data) {
    const m = epsReadPSHeader(data, 16384).match(/%%Creator:[ \t]*(.+)/);
    if (!m) return "";
    let value = m[1].trim();
    // PS 文字列形式 "(value)" の外側カッコ除去（内側カッコ eps2write 等は保持）。
    if (value.startsWith("(") && value.endsWith(")")) value = value.slice(1, -1);
    return value;
  }
  function epsIsPhotoshop(data) {
    return epsReadPSHeader(data, 16384).includes("%%Creator: Adobe Photoshop");
  }
  function isPhotoshopFile(data, kind) {
    if (kind === "PSD" || kind === "PSB") return true;
    if (kind === "EPS") return epsIsPhotoshop(data);
    return false;
  }

  // --- ファイル種別（拡張子非依存・コンテンツベース） ---
  function getFileKind(fc, data, pdfXref, simple = false) {
    // A. PDF構造
    if (isPDFBased(data)) {
      if (isAIPDFFormat(data)) { fc.isIllustratorFile = true; return "PDF"; }
      if (pdfXref) {
        // Page[0] 辞書を解決（ObjStm 内の圧縮オブジェクトも辿る）。読めたら痕跡をその場で判定でき、
        // 無ければ確定でプレーンPDF → プレーンPDFのたびの全走査（indexOf /AIMetaData）を回避。
        const pageStr = firstPageDict(data, pdfXref.root, pdfXref.offsets, pdfXref.compressedObjs);
        if (pageStr != null) {
          // 通常の .ai 形式：Page → /PieceInfo /Illustrator → /Private → /AIMetaData
          const illusN = pdfObjRef("Illustrator", pageStr);
          if (illusN != null) {
            const illusStr = pdfObjStr(data, pdfXref.offsets, illusN, pdfXref.compressedObjs);
            const privN = illusStr ? pdfObjRef("Private", illusStr) : null;
            const privStr = privN != null ? pdfObjStr(data, pdfXref.offsets, privN, pdfXref.compressedObjs) : null;
            const metaN = privStr ? pdfObjRef("AIMetaData", privStr) : null;
            if (metaN != null) {
              fc.isIllustratorFile = true;
              fc.isTemplate = isIllustratorTemplateFormat(data);
              return "Ai";
            }
          }
          // Photoshop編集機能保持PDF（Page → /PieceInfo /AdobePhotoshop）
          if (pageStr.includes("/AdobePhotoshop")) { fc.isPhotoshopEditablePDF = true; return "PDF"; }
          // Page 辞書を読めて Illustrator/Photoshop の痕跡なし → 確定でプレーンPDF（全走査しない）
          return "PDF";
        }
      }
      // Page 辞書を構造的に読めなかったときだけの前方探索フォールバック（簡易では省略）。
      if (!simple && indexOf(data, b("/AIMetaData"), 0, data.length) >= 0) {
        fc.isIllustratorFile = true;
        fc.isTemplate = isIllustratorTemplateFormat(data);
        return "Ai";
      }
      return "PDF";
    }
    // B. PostScript
    const ps = epsReadPSHeader(data, 16384);
    const firstLine = ps.split(/\r|\n/)[0] || "";
    if (firstLine.includes("%!PS-Adobe-")) {
      const isIll = ps.includes("%%AI8_CreatorVersion:")
        || ps.includes("%%Creator: Adobe Illustrator")
        || ps.includes("%%Creator: (Adobe Illustrator");
      if (firstLine.includes("EPSF-")) { fc.isIllustratorFile = isIll; return "EPS"; }
      if (isIll) { fc.isIllustratorFile = true; return "Ai"; }
    }
    // C. PSD/PSB ネイティブ（8BPS）。version(byte4-5, big-endian): 1=PSD / 2=PSB
    if (data.length >= 4 && data[0] === 0x38 && data[1] === 0x42 && data[2] === 0x50 && data[3] === 0x53) {
      const version = data.length >= 6 ? ((data[4] << 8) | data[5]) : 1;
      return version === 2 ? "PSB" : "PSD";
    }
    return "";
  }

  // --- XMP CreatorTool 抽出 ---
  function extractCreatorTool(data, start, end) {
    const k1 = b("<xmp:CreatorTool>");
    let idx = indexOf(data, k1, start, end);
    if (idx >= 0) {
      const s = idx + k1.length, lim = Math.min(end, s + 200);
      let e = s; while (e < lim && data[e] !== 0x3C /*<*/) e++;
      return latin1(data, s, e).trim();
    }
    const k2 = b('xmp:CreatorTool="');
    idx = indexOf(data, k2, start, end);
    if (idx >= 0) {
      const s = idx + k2.length, lim = Math.min(end, s + 200);
      let e = s; while (e < lim && data[e] !== 0x22 /*"*/) e++;
      return latin1(data, s, e).trim();
    }
    return "";
  }
  function getCreatorTool(data) { // 非PDF・非ai/ait 用：先頭最大50MB走査
    const limit = Math.min(data.length, 50 * 1024 * 1024);
    return extractCreatorTool(data, 0, limit);
  }

  // --- PDF xref 解析 ---
  function pdfObjRef(key, s) {
    const m = s.match(new RegExp("/" + key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s+(\\d+)\\s+0\\s+R"));
    return m ? parseInt(m[1], 10) : null;
  }
  function pdfFirstKid(s) {
    const m = s.match(/\/Kids\s*\[\s*(\d+)\s+0\s+R/);
    return m ? parseInt(m[1], 10) : null;
  }
  function pdfIntVal(key, s) {
    const m = s.match(new RegExp("/" + key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s+(\\d+)"));
    return m ? parseInt(m[1], 10) : null;
  }
  function pdfObjStr(data, offsets, num, compressedObjs) {
    const off = offsets[num];
    if (off != null) {
      // 既定は 4KB 窓（小さな辞書はこれで完結）。最初の 4KB に endobj が無ければ巨大辞書
      // （大量の Resources を持ち末尾に /PieceInfo<</Illustrator …>> が来る .ai 等）とみなし、
      // endobj まで（上限 256KB）窓を広げて辞書全体を確実に含める（/PieceInfo 取りこぼし防止）。
      let end = Math.min(data.length, off + 4096);
      if (indexOf(data, b("endobj"), off, end) < 0) {
        const cap = Math.min(data.length, off + 256 * 1024);
        const e = indexOf(data, b("endobj"), off, cap);
        end = e >= 0 ? Math.min(cap, e + 6) : cap;
      }
      const s = latin1(data, off, end);
      return s.startsWith(num + " 0 obj") ? s : null;
    }
    // 非圧縮テーブルに無い → ObjStm 内の圧縮オブジェクト（parsePDFXref で展開済み）から解決。
    // 取り出した本体は "N 0 obj" 接頭辞を持たないが、呼び出し側は辞書内をパターン検索するだけなので問題ない。
    if (compressedObjs && compressedObjs[num] != null) return compressedObjs[num];
    return null;
  }

  // Catalog → Pages → Page[0] の辞書を解決して返す（構造的に読めなければ null）。
  // 読めれば /Illustrator・/AdobePhotoshop の有無をその場で判定でき、無ければ確定でプレーンPDF
  // → プレーンPDFのたびに全走査（indexOf /AIMetaData）する必要がなくなる。compressedObjs で ObjStm も辿る。
  function firstPageDict(data, root, offsets, compressedObjs) {
    const catStr = pdfObjStr(data, offsets, root, compressedObjs); if (!catStr) return null;
    const pagesN = pdfObjRef("Pages", catStr); if (pagesN == null) return null;
    const pagesStr = pdfObjStr(data, offsets, pagesN, compressedObjs); if (!pagesStr) return null;
    const pageN = pdfFirstKid(pagesStr); if (pageN == null) return null;
    return pdfObjStr(data, offsets, pageN, compressedObjs);
  }

  // /Key [ n1 n2 … ]（W や Index）の整数配列
  function pdfIntArray(key, s) {
    const re = new RegExp("/" + key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s*\\[([^\\]]*)\\]");
    const m = s.match(re);
    if (!m) return null;
    const nums = m[1].split(/\s+/).filter(Boolean).map(Number).filter(n => !isNaN(n));
    return nums.length ? nums : null;
  }

  // PDF プレディクタ（PNG, Predictor 10〜15）解除。入力は「1Bフィルタタイプ + columns B」を1行とする。
  function applyPNGPredictor(data, columns) {
    if (columns <= 0) return null;
    const bpp = 1, rowLen = columns + 1;
    if (data.length < rowLen) return null;
    const rows = Math.floor(data.length / rowLen);
    const out = new Uint8Array(rows * columns);
    let prev = new Uint8Array(columns);
    for (let r = 0; r < rows; r++) {
      const base = r * rowLen, ft = data[base];
      const cur = new Uint8Array(columns);
      for (let k = 0; k < columns; k++) cur[k] = data[base + 1 + k];
      if (ft === 1) { for (let k = bpp; k < columns; k++) cur[k] = (cur[k] + cur[k - bpp]) & 0xff; }
      else if (ft === 2) { for (let k = 0; k < columns; k++) cur[k] = (cur[k] + prev[k]) & 0xff; }
      else if (ft === 3) { for (let k = 0; k < columns; k++) { const left = k >= bpp ? cur[k - bpp] : 0; cur[k] = (cur[k] + ((left + prev[k]) >> 1)) & 0xff; } }
      else if (ft === 4) { for (let k = 0; k < columns; k++) { const a = k >= bpp ? cur[k - bpp] : 0, bb = prev[k], c = k >= bpp ? prev[k - bpp] : 0; const pp = a + bb - c, pa = Math.abs(pp - a), pb = Math.abs(pp - bb), pc = Math.abs(pp - c); const pr = (pa <= pb && pa <= pc) ? a : (pb <= pc ? bb : c); cur[k] = (cur[k] + pr) & 0xff; } }
      else if (ft !== 0) return null;
      out.set(cur, r * columns);
      prev = cur;
    }
    return out;
  }

  // 相互参照ストリーム（PDF 1.5+ の圧縮 xref。/Type /XRef）1 セクションを解析。
  // type1=非圧縮（offsets にオフセット）、type2=ObjStm 内の圧縮オブジェクト（compressed に {stm,idx}）。
  async function parseXrefStreamSection(data, off, offsets, compressed, ctx) {
    const si = indexOf(data, b("stream"), off, Math.min(data.length, off + 65536));
    if (si < 0) return;
    const dict = latin1(data, off, si);
    const W = pdfIntArray("W", dict);
    if (!W || W.length < 3 || W[0] < 0 || W[1] < 0 || W[2] < 0) return;
    const rowLen = W[0] + W[1] + W[2];
    if (rowLen <= 0) return;
    const size = pdfIntVal("Size", dict) || 0;
    const index = pdfIntArray("Index", dict) || [0, size];
    if (index.length < 2) return;
    if (ctx.root == null) ctx.root = pdfObjRef("Root", dict);
    const prev = pdfIntVal("Prev", dict);
    if (prev != null) ctx.queue.push(prev);

    const length = pdfIntVal("Length", dict);
    if (!(length > 0)) return;
    let rel = si + "stream".length - off;
    if (data[off + rel] === 0x0D) rel++;
    if (data[off + rel] === 0x0A) rel++;
    const bodyOff = off + rel;
    if (bodyOff + length > data.length) return;
    const raw = data.subarray(bodyOff, bodyOff + length);
    let dec = dict.includes("/FlateDecode") ? await inflate(raw, false) : raw;
    if (!dec) return;
    const predictor = pdfIntVal("Predictor", dict) || 1;
    if (predictor >= 10) {
      const columns = pdfIntVal("Columns", dict) || rowLen;
      dec = applyPNGPredictor(dec, columns);
      if (!dec) return;
    }
    if (dec.length < rowLen) return;
    const be = (s, n) => { let v = 0; for (let i = 0; i < n; i++) v = v * 256 + dec[s + i]; return v; };
    const totalRows = Math.floor(dec.length / rowLen);
    let rowNo = 0;
    for (let pi = 0; pi + 1 < index.length; pi += 2) {
      const startObj = index[pi], count = index[pi + 1];
      for (let k = 0; k < count; k++) {
        if (rowNo >= totalRows) return;
        const base = rowNo * rowLen;
        const type = W[0] === 0 ? 1 : be(base, W[0]);
        const objNum = startObj + k;
        if (type === 1) {
          if (offsets[objNum] == null && compressed[objNum] == null) offsets[objNum] = be(base + W[0], W[1]);
        } else if (type === 2) {
          if (offsets[objNum] == null && compressed[objNum] == null)
            compressed[objNum] = { stm: be(base + W[0], W[1]), idx: be(base + W[0] + W[1], W[2]) };
        }
        rowNo++;
      }
    }
  }

  // ObjStm（/Type /ObjStm）を展開してヘッダ（objNum 相対オフセット列）と本体バイトを返す
  async function objStmDecode(data, offsets, stmNum) {
    const off = offsets[stmNum]; if (off == null) return null;
    const header = latin1(data, off, Math.min(data.length, off + 8192));
    const si = header.indexOf("stream"); if (si < 0) return null;
    const dict = header.slice(0, si);
    if (!dict.includes("/ObjStm")) return null;
    const fm = dict.match(/\/First\s+(\d+)/); if (!fm) return null;
    const first = parseInt(fm[1], 10);
    const inflated = await readPDFObjStream(data, offsets, stmNum);
    if (!inflated || !(first > 0) || first > inflated.length) return null;
    const headerNums = latin1(inflated, 0, first).split(/\s+/).filter(Boolean).map(Number);
    return { first, bytes: inflated, headerNums };
  }

  async function parsePDFXref(data) {
    const fileSize = data.length;
    if (fileSize === 0) return null;
    const tail = latin1(data, Math.max(0, fileSize - 1024), fileSize);
    let xrefOff = null;
    const lines = tail.split(/\r\n|\r|\n/).reverse();
    for (const line of lines) {
      const t = line.trim();
      if (/^\d+$/.test(t)) { xrefOff = parseInt(t, 10); break; }
    }
    if (xrefOff == null) return null;

    const offsets = {};
    const compressed = {};           // objNum → { stm, idx }（ObjStm 内の圧縮オブジェクト）
    const ctx = { root: null, queue: [xrefOff] };
    const seen = new Set();

    while (ctx.queue.length) {
      const off = ctx.queue.shift();
      if (seen.has(off)) continue;
      seen.add(off);
      if (off < 0 || off >= fileSize) continue;

      // クラシック相互参照テーブル（"xref" 始まり）か相互参照ストリーム（"N G obj" 始まり）かを先頭で判別
      const peek = latin1(data, off, Math.min(fileSize, off + 16)).trim();
      if (!peek.startsWith("xref")) {
        // PDF 1.5+ の相互参照ストリーム
        await parseXrefStreamSection(data, off, offsets, compressed, ctx);
        continue;
      }

      // off から 'trailer' までを取り出す
      const tIdx = indexOf(data, b("trailer"), off, fileSize);
      const regionEnd = tIdx >= 0 ? Math.min(fileSize, tIdx + 2048) : Math.min(fileSize, off + 65536);
      const s = latin1(data, off, regionEnd);
      if (!s.startsWith("xref")) continue;

      const sNorm = s.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const rows = sNorm.split("\n");
      let p = 1; // "xref" 行をスキップ
      outer:
      while (p < rows.length) {
        const l = rows[p++].trim();
        if (l.startsWith("trailer")) break;
        const parts = l.split(/\s+/).filter(Boolean);
        if (parts.length !== 2) continue;
        const secStart = parseInt(parts[0], 10), secCount = parseInt(parts[1], 10);
        if (isNaN(secStart) || isNaN(secCount)) continue;
        let objID = secStart;
        for (let k = 0; k < secCount; k++) {
          if (p >= rows.length) break outer;
          const ep = rows[p++].trim().split(/\s+/).filter(Boolean);
          if (ep.length >= 3 && ep[2] === "n") {
            const fileOff = parseInt(ep[0], 10);
            if (!isNaN(fileOff) && offsets[objID] == null) offsets[objID] = fileOff;
          }
          objID++;
        }
      }
      const trailerPos = s.indexOf("trailer");
      if (trailerPos >= 0) {
        const ts = s.slice(trailerPos + "trailer".length);
        if (ctx.root == null) ctx.root = pdfObjRef("Root", ts);
        const prev = pdfIntVal("Prev", ts);
        if (prev != null) ctx.queue.push(prev);
        const xstm = pdfIntVal("XRefStm", ts);   // ハイブリッド参照
        if (xstm != null) ctx.queue.push(xstm);
      }
    }
    if (ctx.root == null) return null;

    // type2（圧縮オブジェクト）を ObjStm から展開して dict 文字列に解決しておく
    // （こうしておけば pdfObjStr は同期のまま offsets / compressedObjs を引くだけで済む）。
    const compressedObjs = {};
    const byStm = {};
    for (const [objNumStr, loc] of Object.entries(compressed)) {
      (byStm[loc.stm] = byStm[loc.stm] || []).push({ obj: parseInt(objNumStr, 10), idx: loc.idx });
    }
    for (const stmStr of Object.keys(byStm)) {
      const body = await objStmDecode(data, offsets, parseInt(stmStr, 10));
      if (!body) continue;
      const { first, bytes, headerNums } = body;
      for (const { obj, idx } of byStm[stmStr]) {
        const offPos = idx * 2 + 1;
        if (offPos >= headerNums.length) continue;
        const startRel = headerNums[offPos];
        const endRel = (offPos + 2 < headerNums.length) ? headerNums[offPos + 2] : (bytes.length - first);
        const start = first + startRel, end = Math.min(first + endRel, bytes.length);
        if (start >= 0 && start <= end && end <= bytes.length) compressedObjs[obj] = latin1(bytes, start, end);
      }
    }

    return { root: ctx.root, offsets, compressedObjs };
  }

  function traverseToAIMetaDataObj(data, root, offsets, compressedObjs) {
    const pageStr = firstPageDict(data, root, offsets, compressedObjs); if (!pageStr) return null;
    const illusN = pdfObjRef("Illustrator", pageStr); if (illusN == null) return null;
    const illusStr = pdfObjStr(data, offsets, illusN, compressedObjs); if (!illusStr) return null;
    const privN = pdfObjRef("Private", illusStr); if (privN == null) return null;
    const privStr = pdfObjStr(data, offsets, privN, compressedObjs); if (!privStr) return null;
    return pdfObjRef("AIMetaData", privStr);
  }

  async function readPDFObjStream(data, offsets, num) {
    const off = offsets[num]; if (off == null) return null;
    const header = latin1(data, off, Math.min(data.length, off + 8192));
    const lm = header.match(/\/Length (\d+)/); if (!lm) return null;
    const streamLen = parseInt(lm[1], 10); if (!(streamLen > 0)) return null;
    const si = header.indexOf("stream"); if (si < 0) return null;
    let rel = si + 6;
    if (data[off + rel] === 0x0D) rel++;
    if (data[off + rel] === 0x0A) rel++;
    const bodyOff = off + rel;
    if (bodyOff + streamLen > data.length) return null;
    const raw = data.subarray(bodyOff, bodyOff + streamLen);
    const hasFilter = header.slice(0, si).includes("/Filter");
    return hasFilter ? await inflate(raw, false) : raw;
  }

  // Photoshop編集機能保持PDF の埋め込みデータから psVersion を取得する。
  // Page → /PieceInfo /AdobePhotoshop << … /Private N 0 R >> → /StandardImageFileData（FlateDecode）→ cinf。
  // /AdobePhotoshop はインライン辞書のため、その直後の /Private 参照を拾う。
  async function psVersionFromPhotoshopPDF(data, root, offsets, compressedObjs) {
    const pageStr = firstPageDict(data, root, offsets, compressedObjs); if (!pageStr) return "";
    const ap = pageStr.indexOf("/AdobePhotoshop"); if (ap < 0) return "";
    const afterAP = pageStr.slice(ap + "/AdobePhotoshop".length);
    const privN = pdfObjRef("Private", afterAP); if (privN == null) return "";
    const privStr = pdfObjStr(data, offsets, privN, compressedObjs); if (!privStr) return "";
    const dataN = pdfObjRef("StandardImageFileData", privStr); if (dataN == null) return "";
    const inflated = await readPDFObjStream(data, offsets, dataN); if (!inflated) return "";
    return parsePsVersionFromCinf(inflated);
  }

  async function aiMetaDataStream(data, xref) {
    const metaN = traverseToAIMetaDataObj(data, xref.root, xref.offsets, xref.compressedObjs);
    if (metaN == null) return null;
    return await readPDFObjStream(data, xref.offsets, metaN);
  }

  async function aiMetaDataStreamForward(data) {
    const key = b("/AIMetaData ");
    const kr = indexOf(data, key, 0, data.length); if (kr < 0) return null;
    let i = kr + key.length;
    let numStr = "";
    while (i < data.length && data[i] >= 0x30 && data[i] <= 0x39) { numStr += String.fromCharCode(data[i]); i++; }
    const objNum = parseInt(numStr, 10); if (isNaN(objNum)) return null;

    const objMarker = b(objNum + " 0 obj");
    const objRange = indexOf(data, objMarker, 0, data.length); if (objRange < 0) return null;
    const start = objRange + objMarker.length;
    const header = latin1(data, start, Math.min(data.length, start + 8192));
    const lm = header.match(/\/Length (\d+)/); if (!lm) return null;
    const streamLen = parseInt(lm[1], 10); if (!(streamLen > 0)) return null;
    const si = header.indexOf("stream"); if (si < 0) return null;
    let rel = si + 6;
    if (data[start + rel] === 0x0D) rel++;
    if (data[start + rel] === 0x0A) rel++;
    const bodyOff = start + rel;
    if (bodyOff + streamLen > data.length) return null;
    const raw = data.subarray(bodyOff, bodyOff + streamLen);
    const hasFilter = header.slice(0, si).includes("/Filter");
    return hasFilter ? await inflate(raw, false) : raw;
  }

  function getCreatorToolViaXref(data, xref) {
    const catStr = pdfObjStr(data, xref.offsets, xref.root, xref.compressedObjs); if (!catStr) return "";
    const metaN = pdfObjRef("Metadata", catStr); if (metaN == null) return "";
    const metaOff = xref.offsets[metaN]; if (metaOff == null) return "";
    const header = latin1(data, metaOff, Math.min(data.length, metaOff + 512));
    const lm = header.match(/\/Length (\d+)/); if (!lm) return "";
    const totalLen = parseInt(lm[1], 10); if (!(totalLen > 0)) return "";
    const si = header.indexOf("stream"); if (si < 0) return "";
    let rel = si + 6;
    if (data[metaOff + rel] === 0x0D) rel++;
    if (data[metaOff + rel] === 0x0A) rel++;
    const bodyOff = metaOff + rel;
    const readLen = Math.min(totalLen, 256 * 1024);
    return extractCreatorTool(data, bodyOff, Math.min(data.length, bodyOff + readLen));
  }

  // --- 行解析 ---
  function extractString(data, start, end) {
    let s = utf8(data, start, end).trim();
    if (s.startsWith("(") && s.endsWith(")")) s = s.slice(1, -1);
    return s;
  }
  function illustratorMajorVersion(creator1) {
    const m = creator1.match(/Illustrator[^ ]* ([.\d]+)/);
    if (!m) return null;
    const v = parseInt(m[1].split(".")[0], 10);
    return isNaN(v) ? null : v;
  }
  function processLineData(data, start, end, fc) {
    const lineLen = end - start;
    if (lineLen <= 2) return;
    if (!fc.creator1 && lineLen > markerCreator.length && startsWith(data, start, markerCreator)) {
      fc.creator1 = extractString(data, start + markerCreator.length, end);
    } else if (!fc.ai8CreatorVersion && lineLen > markerAI8.length && startsWith(data, start, markerAI8)) {
      fc.ai8CreatorVersion = extractString(data, start + markerAI8.length, end);
      if (fc.kind === "EPS" && fc.creator1) {
        const ver = illustratorMajorVersion(fc.creator1);
        if (ver != null && ver < 9) fc.hasCreator2 = false;
      }
    } else if (fc.kind === "EPS" && fc.creator1 && !fc.creator2
      && lineLen > markerCreator.length && startsWith(data, start, markerCreator)) {
      fc.creator2 = extractString(data, start + markerCreator.length, end);
      fc.hasCreator2 = true;
    }
  }

  // PDF（AIMetaData ストリーム）からのバージョンスキャン
  async function scanVersionCommentsFromPDF(data, xref, fc, simple = false) {
    let stream = await aiMetaDataStream(data, xref);
    // 前方フォールバック（全体走査）は簡易では省略。xref で取れなければバージョン空で確定。
    if (!stream && !simple) stream = await aiMetaDataStreamForward(data);
    if (!stream) return;
    if (fc.kind !== "EPS" && fc.kind !== "PDF") fc.kind = "Ai";
    const n = stream.length;
    let i = 0;
    while (i < n) {
      let j = i;
      while (j < n && stream[j] !== 0x0D && stream[j] !== 0x0A) j++;
      processLineData(stream, i, j, fc);
      if (fc.creator1 && fc.ai8CreatorVersion) { fc.hasCreator2 = false; return; }
      let a = j + 1;
      if (j < n && stream[j] === 0x0D && a < n && stream[a] === 0x0A) a++;
      i = (a > i) ? a : i + 1;
    }
  }

  function parseBeginDataByteCount(data, from, end) {
    let i = from;
    while (i < end && data[i] === 0x20) i++;
    let n = 0, found = false;
    while (i < end && data[i] >= 0x30 && data[i] <= 0x39) {
      n = n * 10 + (data[i] - 0x30); found = true; i++;
    }
    return found ? n : 0;
  }

  // EPS・旧AI（非PDF構造）の逐次スキャン。%%BeginData: は指定バイト数だけスキップ。
  function scanVersionComments(data, fc) {
    const n = data.length;
    const PCT = 0x25;
    let i = 0;
    while (i < n) {
      if (fc.kind === "EPS" && fc.creator1 && fc.ai8CreatorVersion) break; // notDetectEPSCompatibleVer 相当

      let j = i;
      while (j < n && data[j] !== 0x0D && data[j] !== 0x0A) j++;
      let after = j + 1;
      if (j < n && data[j] === 0x0D && after < n && data[after] === 0x0A) after++;
      const lineLen = j - i;

      if (lineLen >= 2 && data[i] === PCT && data[i + 1] === PCT) {
        if (startsWith(data, i, markerBeginData)) {
          const skip = parseBeginDataByteCount(data, i + markerBeginData.length, j);
          if (skip > 0) { i = after + skip; continue; }
        }
        processLineData(data, i, j, fc);
        if (fc.kind === "Ai" && fc.creator1 && fc.ai8CreatorVersion) { fc.hasCreator2 = false; break; }
        if (fc.kind === "EPS" && fc.creator1 && fc.creator2) break;
        if (fc.kind === "EPS" && fc.creator1 && !fc.hasCreator2) break;
      }
      i = (after > i) ? after : i + 1;
    }
  }

  // --- バージョン判定 ---
  function versionNumberSuffix(s) {
    const m = s.match(/[.\d]+$/);
    return m ? m[0] : "";
  }
  function extractLegacyCreatorVersion(creator1) {
    const m = creator1.match(/Illustrator[^ ]*\s+(\d+(?:\.\d+)?[A-Za-z]?)/);
    return m ? m[1] : "";
  }
  function determineVersion(fc) {
    const isLegacy = !fc.ai8CreatorVersion && !fc.creator2 && (fc.kind === "Ai" || fc.kind === "EPS");
    fc.determineCreated = fc.ai8CreatorVersion;
    if (fc.isIllustratorFile) {
      if (isLegacy) {
        fc.determineCreated = extractLegacyCreatorVersion(fc.creator1);
        fc.determineSaved = "";
      } else if (fc.kind === "EPS") {
        fc.determineSaved = fc.hasCreator2 ? versionNumberSuffix(fc.creator2) : versionNumberSuffix(fc.creator1);
      } else {
        fc.determineSaved = versionNumberSuffix(fc.creator1);
      }
    }
    const created = parseInt((fc.determineCreated.split(".")[0]) || "", 10) || 0;
    const saved = parseInt((fc.determineSaved.split(".")[0]) || "", 10) || 0;
    if (created >= 17 && created <= 23 && saved === 17) fc.isSavedLowerVersion = false;
    else if (created >= 24 && saved === 24) fc.isSavedLowerVersion = false;

      case 12: return "CS2";
      case 13: return "CS3";
      case 14: return "CS4";
      case 15: return minor > 0 ? "CS5." + minor : "CS5";
      case 16: return "CS6";
      case 17: return "CC";
      case 18: return "CC 2014";
      case 19: return "CC 2015";
      case 20: return "CC 2015.3";
      case 21: return "CC 2017";
      case 22: return "CC 2018";

      isPhotoshopEditablePDF: false,
      xmpCreatorTool: "", creator1: "", creator2: "", ai8CreatorVersion: "",

    }

      case 1: case 2: case 3: case 4: return parts[0];
      case 5: return minorSuffix === "" ? (minor > 0 ? "5." + minor : "5") : "5";

      case 8: return "CS";
      case 9: return "CS2";
      case 10: return "CS3";
      case 11: return "CS4";
      case 12: return minor > 0 ? "CS5." + minor : "CS5";
      case 13: return "CS6";
      case 14: return "CC";
      case 15: return "CC 2014";
      case 16: return "CC 2015";
      case 17: return "CC 2015.5";
      case 18: return "CC 2017";
      case 19: return "CC 2018";

  async function psVersionFromCinf(file) {
    const read = async (off, n) => {
      if (off < 0 || off + n > file.size) return null;
      const buf = new Uint8Array(await file.slice(off, off + n).arrayBuffer());
      return buf.length === n ? buf : null;
    };

    const head = await read(0, 6);
    if (!head || !(head[0] === 0x38 && head[1] === 0x42 && head[2] === 0x50 && head[3] === 0x53)) return "";
    const isPSB = be(head.subarray(4, 6)) === 2;

    d = await read(o, 4); if (!d) return ""; o += 4 + be(d);   // Color Mode Data
    d = await read(o, 4); if (!d) return ""; o += 4 + be(d);   // Image Resources
    d = await read(o, lenW); if (!d) return ""; const lmLen = be(d); o += lenW;  // Layer&Mask 長
    if (lmLen <= 0) return "";

    d = await read(o, lenW); if (!d) return ""; o += lenW + be(d);  // Layer Info skip
    if (o + 4 <= lmEnd) { d = await read(o, 4); if (d) o += 4 + be(d); }  // Global Layer Mask Info skip

      const sig = await read(o, 4); if (!sig) return "";

      const is8B64 = sig[0] === 0x38 && sig[1] === 0x42 && sig[2] === 0x36 && sig[3] === 0x34; // "8B64"

      const key = latin1(keyD, 0, 4);

      const blockLen = be(lenD);

        const cinf = await read(dStart, Math.min(blockLen, 65536));
        return cinf ? parsePsVersionFromCinf(cinf) : "";
      }
      o = dStart + blockLen + (blockLen & 1);    // データ長を偶数に切り上げ
    }
    return "";
  }

  // cinf descriptor から psVersion(major.minor.fix) を抽出（Vrsn=1.3.0 は psVersion より前に出るため取り違えない）。
  function parsePsVersionFromCinf(d) {
    const needle = b("psVersion");
    const r = indexOf(d, needle, 0, d.length);
    if (r < 0) return "";
    const after = r + needle.length;
    function longAfter(key) {
      const kb = b(key);
      const j = indexOf(d, kb, after, d.length);
      if (j < 0) return null;
      const vs = j + kb.length + 4;              // key 直後の type(4B 'long') を飛ばす
      if (vs + 4 > d.length) return null;
      return (d[vs] << 24) | (d[vs + 1] << 16) | (d[vs + 2] << 8) | d[vs + 3];
    }
    const mj = longAfter("major"), mn = longAfter("minor"), fx = longAfter("fix");
    if (mj == null || mn == null || fx == null) return "";
    return mj + "." + mn + "." + fx;
  }

  // Photoshop EPS の PS ヘッダ（既読の先頭16KB）から %%Creator のバージョンを抽出（全体スキャン不要）。
  function psVersionFromEPSCreator(data) {
    const ps = epsReadPSHeader(data, 16384);
    const m = ps.match(/%%Creator: Adobe Photoshop Version (\d+\.\d+\.\d+)/);
    return m ? m[1] : "";
  }

  // 表示用バージョン文字列
  function formatVersion(fc) {
    // Photoshop（PSD/PSB/EPS）: cinf / %%Creator から得た psVersion を表示（例 "2025 (26.11.5)"）
    if (fc.appName === "Photoshop") {
      return fc.psVersion ? psVersionName(fc.psVersion) + " (" + fc.psVersion + ")" : "";
    }
    if (!fc.isIllustratorFile || !fc.determineCreated) return "";
    const alias = versionName(fc.determineCreated);
    let text = alias + " (" + fc.determineCreated + ")";
    text = text.replace(/\((\d+\.\d+\.\d+)(?:\.\d+)+\)/, "($1)");
    return text;
  }

  return { parse, formatVersion, psVersionFromCinf, psVersionFromEPSCreator };
})();

/* ===========================================================================
 *  InDesign パーサー（File Ver Id 移植）
 * ==========================================================================*/

const Id = (() => {
  const magic = new Uint8Array([
    0x06, 0x06, 0xED, 0xF5, 0xD8, 0x1D, 0x46, 0xE5,
    0xBD, 0x31, 0xEF, 0xE7, 0xFE, 0x74, 0xB7, 0x1D
  ]);
  const validFileTypes = new Set(["DOCUMENT", "BOOKBOOK", "LIBRARY4", "LIBRARY2"]);
  const validExtensions = new Set([".indd", ".indb", ".indl", ".indt", ".idml"]);

  function appName(major, minor) {
    switch (major) {
      case 3: return "CS";
      case 4: return "CS2";
      case 5: return "CS3";
      case 6: return "CS4";
      case 7: return minor >= 5 ? "CS5.5" : "CS5";
      case 8: return "CS6";
      case 9: return "CC";
      case 10: return "CC 2014";
      case 11: return "CC 2015";
      case 12: return "CC 2017";
      case 13: return "CC 2018";
      case 14: return "CC 2019";
      default: return major >= 15 ? String(major + 2005) : String(major);
    }
  }

  function isBinaryHeader(data) {
    return data.length >= 16 && arraysEqual(data.subarray(0, 16), magic);
  }

  // --- xref スキャン ---
  function isDigit(byte) { return byte >= 0x30 && byte <= 0x39; }

  function versionRange(data, dotAt, lo, hi) {
    if (dotAt <= lo) return null;
    let start = dotAt - 1;
    while (start > lo && isDigit(data[start - 1])) start--;
    if (!isDigit(data[start])) return null;
    let pos = dotAt + 1, dots = 1;
    while (pos < hi) {
      if (isDigit(data[pos])) pos++;
      else if (data[pos] === 0x2E && dots < 3) { dots++; pos++; }
      else break;
    }
    if (dots !== 3 || pos <= dotAt + 1) return null;
    if (!isDigit(data[pos - 1])) return null;

    const offsetFromStart = start - lo;
    const greedyLen = pos - start;
    if (offsetFromStart >= 2) {
      if (data[start - 1] === 0x40) {
        const declared = data[start - 2];
        if (declared >= 5 && declared <= 15 && declared <= greedyLen) return [start, start + declared];
      } else if (data[start - 2] === 0x40) {
        const declared = data[start - 1];
        if (declared >= 5 && declared <= 15 && declared <= greedyLen) return [start, start + declared];
      }
    }
    return [start, pos];
  }

  // バージョン文字列直後 +2..+5 の 4 バイトを ts32 として読む（hi で打ち切り、不足分は 0）。
  // バイト順はファイルのフォーマットに従う（旧フォーマット＝ビッグエンディアン。
  // 「新旧」は年代でなくエンディアン系譜で、CS/CS2 由来ファイルは現代の InDesign で
  // 保存し直しても BE のまま引き継がれる）。
  // 採用比較で使うのは旧 ts6 の (>>16)&0xFFFFFFFF＝この 32bit のみなので、低速な BigInt を
  // 介さず通常の Number で扱う（ヒット毎の BigInt 確保・演算が走査の主要コストだった）。
  function readTS32(data, start, hi, bigEndian) {
    let v = 0;
    for (let i = 2; i < 6; i++) {
      const idx = start + i;
      if (idx >= hi) break;
      const shift = bigEndian ? (5 - i) * 8 : (i - 2) * 8;
      v += data[idx] * (1 << shift); // shift は最大24で (1<<24) は正。値側の << は符号付きになるため乗算で組む
    }
    return v;
  }

  // ts32 の妥当域。FILETIME hi32（1601 年起算・1 単位 ≈ 7.16 分）として約 1972〜2172 年に
  // 相当する範囲。範囲外はコンテンツ由来の偽レコード（bid が偶然 8/9 のブロック内のテキスト等）
  // の疑いとして、妥当なレコードが 1 件も無いときだけ採用対象にする。
  const TS32_PLAUSIBLE_MIN = 0x01A00000, TS32_PLAUSIBLE_MAX = 0x02800000;
  function hasSentinel(data, lo, hi) {
    for (let i = lo; i < hi; i++) {
      if (data[i] === 0x40 && i + 6 < hi) {
        let allZero = true;
        for (let k = 1; k <= 6; k++) if (data[i + k] !== 0) { allZero = false; break; }
        if (allZero) return true;
      }
    }
    return false;

  function runXref(data, r, bigEndian) {
    const blockSize = 0x1000;
    const blockCount = Math.floor(data.length / blockSize);

    const candidates = [];
    for (let i = 0; i < blockCount; i++) {

      const bid = readU32LE(data, trailerStart + 4);

    const sentinelHits = [], lastHits = [];

    for (const i of candidates) {
      const chunkStart = i * blockSize;
      const chunkEnd = chunkStart + blockSize;
      if (chunkEnd > data.length) continue;

      // ブロック内のドット探索はネイティブ Uint8Array.indexOf（C++/SIMD）に委ねる。
      // 自前 indexOf の総当たり＋毎回の [0x2E] 確保を排除。subarray は buffer 共有の O(1) ビュー。
      const blk = data.subarray(chunkStart, chunkEnd);
      let from = chunkStart;
      while (true) {
        const rel = blk.indexOf(0x2E, from - chunkStart);
        if (rel < 0) break;
        const pos = chunkStart + rel;
        const vr = versionRange(data, pos, chunkStart, chunkEnd);

          if (hasSentinel(data, vr[1], afterEnd)) sentinelHits.push({ globalOffset, ver, ts32 });

    const pick = (arr) => {
      let pool = arr.filter((e) => e.ts32 >= TS32_PLAUSIBLE_MIN && e.ts32 <= TS32_PLAUSIBLE_MAX);
      if (pool.length === 0) pool = arr;
      let best = null;
      for (const e of pool) {
        if (best === null) { best = e; continue; }
        let greater;
        if (e.ts32 !== best.ts32) greater = e.ts32 > best.ts32;
        else greater = e.globalOffset > best.globalOffset;
        if (greater) best = e;
      }
      return best;

    //  ・indl：xref を持たないため常に major のみ
    //  ・indd/indt：通常は xref で minor を確定するが、簡易（headerOnly）時は xref を引かないので
    //    誤った minor を出さないよう major のみにする。それ以外の世代はヘッダ minor を信頼。
    const unreliableMinor = r.headerMajor >= 8 && r.headerMajor <= 13;
    const majorOnly = unreliableMinor && (r.contentKind === "indl"
      || (headerOnly && (r.contentKind === "indd" || r.contentKind === "indt")));
    const hVer = majorOnly ? String(r.headerMajor) : (r.headerMajor + "." + r.headerMinor);
    r.headerResult = "InDesign " + appName(r.headerMajor, r.headerMinor) + " (" + hVer + ")";

    // 簡易：ファイル全体読み込み＋xref 走査を行わず、ヘッダ結果のまま返す
    if (!headerOnly) runXref(data, r, !newFmt);
    return r;
  }

  // 表示用バージョン文字列
  function formatVersion(r) {
    let v;
    if (r.isValid) {
      switch (r.contentKind) {
        case "indd": case "indt": v = r.xrefResult || r.headerResult; break;
        case "indb": case "indl": v = r.headerResult; break;
        case "idml": v = r.idmlResult; break;
        default: v = "";
      }
    } else {
      v = r.errorMessage;
    }
    let t = v.startsWith("InDesign ") ? v.slice("InDesign ".length) : v;
    t = t.replace(/\((\d+\.\d+\.\d+)(?:\.\d+)+\)/, "($1)");
    return t;
  }

  function kindText(contentKind) {
    switch (contentKind) {
      case "indd": return "InDesign ドキュメント (.indd)";
      case "indt": return "InDesign テンプレート (.indt)";
      case "indl": return "InDesign ライブラリ (.indl)";
      case "indb": return "InDesign ブック (.indb)";
      case "idml": return "InDesign マークアップ (.idml)";
      default: return "";
    }
  }

  return { parse, formatVersion, kindText, isBinaryHeader, zipIndex, isIDMLPackage, validExtensions };
})();

/* ===========================================================================
 *  Ai 表示用 種類テキスト
 * ==========================================================================*/
function aiKindText(fc) {
  const isPhotoshop = (fc.appName === "Photoshop");
  switch (fc.kind) {
    case "PDF":
      if (fc.isPhotoshopEditablePDF) return "PDF - Photoshop 編集機能保持 (.pdf)";
      return fc.isIllustratorFile
        ? "PDF - Illustrator 編集機能保持 (.pdf)"
        : "PDF - 編集機能なし (Ai, Ps) (.pdf)";
    case "Ai":
      return fc.isTemplate ? "Illustrator Template 形式 (.ait)" : "Illustrator 形式 (.ai)";
    case "EPS":
      if (fc.isIllustratorFile) return "Illustrator EPS 形式 (.eps)";
      if (isPhotoshop) return "Photoshop EPS 形式 (.eps)";
      // Illustrator/Photoshop いずれでもない EPS。生成元（creator1）を畳み込む。空なら「生成元不明」。
      return "EPS 形式 - " + (fc.creator1 ? fc.creator1 : "生成元不明") + " (.eps)";
    case "PSD":
      return "Photoshop 形式 (.psd)";
    case "PSB":
      return "ビッグドキュメント形式 (.psb)";
    default:
      return "";
  }
}

// 種類列が赤文字（拡張子偽装 mismatch）でないときは、末尾の " (.拡張子)" 表記を省く。
// デスクトップ版 AFVer の displayKind（FileItem.strippingTrailingExtension）と同型の半角括弧正規表現。
// 「(Ai, Ps)」のような先頭ドットの無い括弧書きは対象外（末尾の " (.pdf)" だけを取り除く）。
function stripExtSuffix(kind, mismatch) {
  return mismatch ? kind : kind.replace(/\s*\(\.[A-Za-z0-9]+\)\s*$/, "");
}

/* ===========================================================================
 *  自動判別ディスパッチャ
 * ==========================================================================*/
const ID_EXTS = new Set(["indd", "indt", "indb", "indl", "idml"]);

async function analyze(file) {
  const name = file.name;
  const ext = extOf(name);

  // EPS・旧AI（非PDF・非ZIP）はファイル先頭の数KBだけで版数が取れる。
  // 大きいファイル（例: 80MB EPS）で全体読み込みがボトルネックになるのを避けるため、
  // まず先頭 64KB だけ読んでヘッダーを判定し、末尾参照が必要な形式のみ全体を読む。
  const PROBE_SIZE = 65536;
  let data;
  if (file.size <= PROBE_SIZE) {
    data = new Uint8Array(await file.arrayBuffer());
  } else {
    const probe = new Uint8Array(await file.slice(0, PROBE_SIZE).arrayBuffer());
    // %PDF・ZIP(PK)・InDesignバイナリ は末尾（xref/EOCD）を参照するため全体が必要。
    // ただし簡易モードのバイナリ InDesign は先頭ヘッダ（プローブ内）だけで判定するので全体読みしない。
    const simpleMode = versionDetail === "simple";
    const needsFull =
      (probe[0] === 0x25 && probe[1] === 0x50 && probe[2] === 0x44 && probe[3] === 0x46) || // %PDF
      (probe[0] === 0x50 && probe[1] === 0x4B) ||  // ZIP / IDML
      (!simpleMode && (Id.isBinaryHeader(probe) || ID_EXTS.has(ext)));  // InDesign（簡易はヘッダのみ）
    if (needsFull) {
      data = new Uint8Array(await file.arrayBuffer());
    } else if (probe[0] === 0xC5 && probe[1] === 0xD0 && probe[2] === 0xD3 && probe[3] === 0xC6) {
      // DOS EPS（バイナリEPS）: PS本体がプレビュー(TIFF/WMF)の後ろにあり、
      // 大きいプレビューだと PS 開始が 64KB プローブの外になる（例: PS_off≈100KB）。
      // ヘッダの PS オフセット(LE 32bit)を見て、PSヘッダが外にあるときだけ [0, PS開始+64KB] を読む
      // （%%Creator/%%AI8_CreatorVersion は PS 先頭付近にあるため）。全体読み込みは避ける。
      const psOff = (probe[4] | (probe[5] << 8) | (probe[6] << 16) | (probe[7] << 24)) >>> 0;
      data = (psOff + 16384 > PROBE_SIZE && psOff < file.size)
        ? new Uint8Array(await file.slice(0, Math.min(psOff + PROBE_SIZE, file.size)).arrayBuffer())
        : probe;
    } else {
      data = probe;
    }
  }

  // InDesign か（マジック / 拡張子 / IDML パッケージ）を先に判定
  let isId = Id.isBinaryHeader(data) || ID_EXTS.has(ext);
  let zi = null;
  if (!isId) {
    zi = Id.zipIndex(data);
    if (zi && await Id.isIDMLPackage(data, zi)) isId = true;
  }

  if (isId) {
    const r = await Id.parse(name, data, versionDetail === "simple");
    let version = Id.formatVersion(r);
    if (versionDetail === "simple") version = truncateToMinor(version);
    let kind = r.contentKind ? Id.kindText(r.contentKind) : "";
    if (!kind && !r.isValid) kind = "—";
    kind = stripExtSuffix(kind, r.isExtMismatch);
    return {
      name, version, kind,
      app: r.isValid ? "id" : "none",
      // 無効な InDesign ファイルのみグレーアウト。拡張子偽装はグレーにせず種類のみ赤文字。
      dim: !r.isValid,
      mismatch: r.isExtMismatch
    };
  }

  // Illustrator / Photoshop / その他
  const fc = await Ai.parse(name, data, versionDetail === "simple");

  // Photoshop バージョン取得（表示専用）: PSD/PSB は file.slice でシーク、EPS は既読 data から
  // 簡易モードでは PSD/PSB の cinf 走査をスキップ（重い経路。cinf を持たない 2019 以前は全走査して
  // 結局 nil）。編集機能保持PDF も Ai.parse 内で簡易時スキップ済み。EPS の %%Creator は軽いので常時。
  if (fc.appName === "Photoshop") {
    if ((fc.kind === "PSD" || fc.kind === "PSB") && versionDetail !== "simple") fc.psVersion = await Ai.psVersionFromCinf(file);
    else if (fc.kind === "EPS") fc.psVersion = Ai.psVersionFromEPSCreator(data);
  }

  let version = Ai.formatVersion(fc);
  if (versionDetail === "simple") version = truncateToMinor(version);
  let kind = aiKindText(fc);
  let app = "none";
  if (fc.kind === "PDF") app = "pdf";                          // 種類PDFは PDF アイコン（編集機能の有無を問わず）
  else if (fc.kind === "EPS" && fc.appName === "Illustrator") app = "eps-ai"; // Illustrator EPS 専用アイコン
  else if (fc.kind === "EPS" && fc.appName === "Photoshop")   app = "eps-ps"; // Photoshop EPS 専用アイコン
  else if (fc.kind === "EPS")                                 app = "eps-other"; // Illustrator/Photoshop 以外の EPS（generic）
  else if (fc.appName === "Illustrator") app = "ai";
  else if (fc.appName === "Photoshop") app = "ps";

  // 拡張子偽装判定
  let expected = [];
  switch (fc.kind) {
    case "Ai": expected = ["ai", "ait"]; break;
    case "EPS": expected = ["eps"]; break;
    case "PSD": expected = ["psd"]; break;
    case "PSB": expected = ["psb"]; break;
    case "PDF": expected = ["pdf"]; break;
  }
  // 拡張子偽装（実拡張子≠期待）と、generic EPS（Illustrator/Photoshop 以外＝素性不明）を区別する。
  // 赤くするのは両方だが、ツールチップの理由文（warnNote）は分ける。
  const realExtMismatch = expected.length > 0 && ext !== "" && !expected.includes(ext);
  const isGenericEPS = fc.kind === "EPS" && !fc.isIllustratorFile && fc.appName !== "Photoshop";
  const mismatch = realExtMismatch || isGenericEPS;
  const warnNote = realExtMismatch ? "（拡張子が内容と一致しません）"
                 : isGenericEPS ? "（Illustrator・Photoshop以外のEPSです）" : "";

  kind = stripExtSuffix(kind, mismatch);
  if (!kind) kind = "対応していないファイル";

  return {
    name, version, kind, app,
    // グレーアウトは「対応していないファイル（app=none）」のみ。
    // 編集機能なしPDFや拡張子偽装はグレーにせず、注意喚起は種類の赤文字(mismatch)で行う。
    dim: app === "none",
    mismatch, warnNote
  };
}

/* ---- バージョン結果キャッシュ（再ドロップ・精度トグルでの再解析を回避） ----
 * Desktop 版の VersionCacheKey（パス＋変更日＋サイズ＋精度）を Web へ移植。File にはパスが
 * 無いため name + size + lastModified + 精度 をキーにする（別フォルダの同名・同サイズ・同更新
 * 日時の衝突は理論上ありうるが実害は小さい）。プロセス（タブ）内のみ・永続化なし。「クリア」では
 * 消さない＝同一ファイル再ドロップを即時化するため。詳細⇔簡易の往復は別キーで両方が残り即時復元。
 * 返す行は毎回シャローコピー：呼び出し側が r.name = path 等で書き換えてもキャッシュ本体を汚さない。
 */
const versionCache = new Map();
function versionCacheKey(file) {
  // 自由長の name を末尾に置けば、size / lastModified / 精度（いずれも区切り ":" を含まない）で
  // 境界が一意に決まり、名前に何が含まれても衝突しない。NUL 等の制御文字を使わずに済む。
  return file.size + ":" + (file.lastModified || 0) + ":" + versionDetail + ":" + file.name;
}
async function analyzeCached(file) {
  const key = versionCacheKey(file);
  const hit = versionCache.get(key);
  if (hit) return { ...hit };
  const r = await analyze(file);   // 例外時は何もキャッシュしない（呼び出し側が errRow 化）
  versionCache.set(key, r);        // 本体を保持し、呼び出し側には常にコピーを返す
  return { ...r };
}

/* ===========================================================================
 *  UI（遅延ロード対応ツリー）

const tbody = document.getElementById("tbody");
const placeholder = document.getElementById("placeholder");

const openMenu = document.getElementById("open-menu");
const miFile = document.getElementById("mi-file");
const miFolder = document.getElementById("mi-folder");
