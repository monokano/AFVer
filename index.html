const noticeEl = document.getElementById("notice");

function showNotice(html) { noticeEl.innerHTML = html; noticeEl.hidden = false; }
function hideNotice() { noticeEl.hidden = true; noticeEl.textContent = ""; }

const SUPPORTED_EXTS = new Set(["ai", "ait", "eps", "pdf", "psd", "psb", "indd", "indt", "indb", "indl", "idml"]);
const PLACEHOLDER_HTML = 'ここにファイルやフォルダをドロップ<small>.ai / .ait / .eps / .pdf / .indd / .indt / .indb / .indl / .idml</small>';
function baseName(name) { const i = name.lastIndexOf("/"); return i < 0 ? name : name.slice(i + 1); }
function isDotfile(name) { return baseName(name).startsWith("."); }

const APP_BADGE = { ai: ['ai', 'Ai'], id: ['id', 'Id'], ps: ['ps', 'Ps'], pdf: ['pdf', 'PDF'],
                    'eps-ai': ['eps-ai', 'EPS'], 'eps-ps': ['eps-ps', 'EPS'],
                    'eps-other': ['eps-other', 'EPS'], none: ['none', '—'] };

// アイコン表示スタイル（"file"＝書類アイコン / "badge"＝従来バッジ）。選択は記憶。
// ※ Chrome を file:// で開くと localStorage アクセスが例外を投げるため try/catch で保護する
//   （ここで例外が漏れると以降の初期化＝ドロップ処理やボタン登録が止まる）。
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// 簡易モードの表示丸め：カッコ内 (major.minor.patch[.x]) を (major.minor) に丸める。
// 既に2桁 (30.3) や major のみ (8) はマッチせず素通り。
function truncateToMinor(text) { return text.replace(/\((\d+)\.(\d+)(?:\.\d+)+\)/, "($1.$2)"); }
let iconStyle = lsGet("afver-iconstyle") === "badge" ? "badge" : "file";
function iconHTML(app) {
  const [bc, bt] = APP_BADGE[app] || APP_BADGE.none;
  return iconStyle === "badge"
    ? `<span class="badge ${bc}">${bt}</span>`
    : `<span class="ficon ${bc}" data-lbl="${bt}"></span>`;
}
// 版数列 行頭のアプリ系統色ドット（File List Print の aiFamily 準拠）。app から系統を導出。
// Illustrator=橙 / Photoshop=青 / InDesign=桃 / PDF=灰（native data 有無を問わず）。none は出さない。
function verDotFamily(app) {
  switch (app) {
    case "ai": case "eps-ai": return "ai";
    case "ps": case "eps-ps": return "ps";
    case "id":  return "id";
    case "pdf": return "pdf";
    case "eps-other": return "eps-other";
    default:    return "";
  }
}
function updateIconStyleBtn() {
  btnIconStyle.textContent = "アイコン: " + (iconStyle === "badge" ? "バッジ" : "ファイル");
}

let rows = [];                 // フラット表示時のみ使用
let treeMode = false;          // フォルダを含むとき true（階層ツリー）
let treeRoot = null;           // ツリーのルートノード
const expanded = new Set();    // 展開中フォルダの path 集合
let sortState = { key: "name", asc: true };
let versionDetail = "full";    // バージョン精度モード: "full"=詳細 / "simple"=簡易
let lastFlatFiles = null;      // フラット表示の再解析（精度切替）用に元 File を保持
let analyzing = false, analyzedCount = 0;
function startAnalyze() { analyzing = true; analyzedCount = 0; }
function endAnalyze() { analyzing = false; }
function bumpAnalyze() { analyzedCount++; }

function errRow(name, e) {
  return { name, version: e ? "解析エラー: " + ((e && e.message) || e) : "読み込めませんでした",
           kind: "—", app: "none", dim: true, mismatch: false };
}

// 解析がまだ済んでいない暫定行（フォルダ展開直後など）。読み取り失敗（errRow）とは区別し、
// バージョン列に「読み込めませんでした」ではなく「判定中…」を出す（誤解防止）。
function pendingRow(name) {
  return { name, version: "判定中…", kind: "—", app: "none", dim: true, mismatch: false };
}

/* ---- 同時実行制限 ---- */
async function mapLimit(items, limit, fn) {
  let next = 0;
  async function worker() { while (next < items.length) { const i = next++; await fn(items[i], i); } }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
}

/* ---- ディレクトリ列挙アダプタ（FSA / 旧Entries を統一） ---- */
function readAllEntries(reader) {
  return new Promise((resolve, reject) => {
    const all = [];
    const step = () => reader.readEntries(
      b => { if (!b.length) resolve(all); else { all.push(...b); step(); } },
      err => reject(err || new Error("readEntries failed"))
    );
    step();
  });
}
function nodeFromFSAHandle(h, name) {
  return h.kind === "directory"
    ? { type: "dir", name, children: [], loaded: false, loading: false, list: () => listFSADir(h) }
    : { type: "file", name, analyzed: false, row: null, strict: false, getFile: () => h.getFile() };
}
async function listFSADir(handle) {
  const kids = [];
  for await (const [name, h] of handle.entries()) kids.push(nodeFromFSAHandle(h, name));
  return kids;
}
function nodeFromEntry(entry, name) {
  return entry.isDirectory
    ? { type: "dir", name, children: [], loaded: false, loading: false, list: () => listEntryDir(entry) }
    : { type: "file", name, analyzed: false, row: null, strict: false,
        getFile: () => new Promise(res => entry.file(res, () => res(null))) };
}
async function listEntryDir(entry) {
  const es = await readAllEntries(entry.createReader());
  return es.map(e => nodeFromEntry(e, e.name));
}

/* ---- ツリー操作（遅延ロード） ---- */
function makeRoot() { return { type: "dir", name: "", path: "", parent: null, children: [], loaded: true, loading: false, list: null }; }

// フォルダの直下一覧を取得して子ノードを構築（中身解析はしない）
async function loadDir(node) {
  if (node.loaded || !node.list) return;
  let kids = [];
  try { kids = await node.list(); } catch (e) { console.warn("一覧失敗:", node.path, e); node.listError = true; }
  node.children = [];
  for (const k of kids) {
    if (isDotfile(k.name)) continue;
    k.parent = node;
    k.path = node.path ? node.path + "/" + k.name : k.name;
    if (k.type === "dir") { node.children.push(k); continue; }
    const ext = extOf(k.name), supported = SUPPORTED_EXTS.has(ext);
    if (!supported && ext !== "") continue;   // 拡張子付きの非対応 → 除外
    k.strict = !supported;                     // 拡張子なしのみ true（Adobe形式と判定できた時のみ表示）
    node.children.push(k);
  }
  node.loaded = true;
}

// フォルダ直下の未解析ファイルを解析し、判定不能な拡張子なしファイルを除外
async function ensureFolderAnalyzed(node) {
  const pending = node.children.filter(c => c.type === "file" && !c.analyzed);
  if (pending.length) {
    await mapLimit(pending, 8, async (fn) => {
      let r;
      try { const file = await fn.getFile(); r = file ? await analyzeCached(file) : errRow(baseName(fn.path)); }
      catch (e) { r = errRow(baseName(fn.path), e); }
      r.name = fn.path; fn.row = r; fn.analyzed = true; bumpAnalyze();
    });
  }
  node.children = node.children.filter(c => !(c.type === "file" && c.strict && c.row && c.row.app === "none"));
}

async function expandDir(node) {
  expanded.add(node.path);
  if (!node.loaded) { node.loading = true; render(); await loadDir(node); node.loading = false; }
  startAnalyze(); render();
  await ensureFolderAnalyzed(node);
  endAnalyze(); render();
}

async function walkExpand(node) {
  if (node.type !== "dir") return;
  if (!node.loaded) await loadDir(node);
  await ensureFolderAnalyzed(node);
  if (node !== treeRoot) expanded.add(node.path);
  for (const c of [...node.children]) if (c.type === "dir") await walkExpand(c);
}
async function expandAll() {
  if (!treeMode || !treeRoot) return;
  startAnalyze(); render();
  await walkExpand(treeRoot);
  endAnalyze(); render();
}

/* ---- ツリー初期化（ドロップ / フォルダ選択。1階層目だけ展開） ---- */
async function initTree(root) {
  treeMode = true; treeRoot = root; rows = [];
  expanded.clear(); hideNotice();
  startAnalyze(); render();
  await ensureFolderAnalyzed(root);                       // トップ直下のファイル
  for (const c of [...root.children]) if (c.type === "dir") {
    expanded.add(c.path);
    if (!c.loaded) await loadDir(c);
    await ensureFolderAnalyzed(c);
  }
  endAnalyze(); render();
}
async function startTreeFromTopNodes(rawTop) {
  const root = makeRoot();
  for (const k of rawTop) {
    if (isDotfile(k.name)) continue;
    k.parent = root; k.path = k.name;
    if (k.type === "file") k.strict = false;              // トップレベルは拡張子不問
    root.children.push(k);
  }
  await initTree(root);
}
// webkitdirectory のフラットな FileList（webkitRelativePath 付き）から木を構築（構造は即時・解析は遅延）
function buildEagerTree(files) {
  const root = makeRoot();
  const index = new Map(); index.set("", root);
  for (const file of files) {
    const rel = file.webkitRelativePath || file.name;
    const parts = rel.split("/");
    if (parts.some(p => p.startsWith("."))) continue;     // 隠しフォルダ/ドットファイル除外
    let parent = root, ppath = "";
    for (let i = 0; i < parts.length - 1; i++) {
      const dpath = ppath ? ppath + "/" + parts[i] : parts[i];
      let d = index.get(dpath);
      if (!d) {
        d = { type: "dir", name: parts[i], path: dpath, parent, children: [], loaded: true, loading: false, list: null };
        index.set(dpath, d); parent.children.push(d);
      }
      parent = d; ppath = dpath;
    }
    const fname = parts[parts.length - 1];
    const ext = extOf(fname), supported = SUPPORTED_EXTS.has(ext);
    if (!supported && ext !== "") continue;
    parent.children.push({ type: "file", name: fname, path: ppath ? ppath + "/" + fname : fname,
                           parent, analyzed: false, row: null, strict: !supported,
                           getFile: () => Promise.resolve(file) });
  }
  return root;
}

/* ---- フラット解析（フォルダを含まないドロップ／ファイル選択） ---- */
async function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f && f.size != null && !isDotfile(f.name));
  if (!files.length) return;
  lastFlatFiles = files;                                 // 精度切替時の再解析用
  treeMode = false; treeRoot = null; rows = []; hideNotice();
  startAnalyze(); render();
  const out = [];
  await mapLimit(files, 8, async (f) => {
    let r; try { r = await analyzeCached(f); } catch (e) { r = errRow(f.name, e); }
    bumpAnalyze(); out.push(r);
  });
  rows = out;
  endAnalyze(); render();
}

/* ---- 並べ替え ---- */
function versionSortKey(v) {
  const m = v.match(/\((\d+)(?:\.(\d+))?(?:\.(\d+))?/);
  return m ? [parseInt(m[1] || "0", 10), parseInt(m[2] || "0", 10), parseInt(m[3] || "0", 10)] : [0, 0, 0];
}
function cmpRow(a, b) {
  const na = baseName(a.name), nb = baseName(b.name);
  if (sortState.key === "ver") {
    const va = versionSortKey(a.version), vb = versionSortKey(b.version);
    return (va[0] - vb[0] || va[1] - vb[1] || va[2] - vb[2]) || na.localeCompare(nb, undefined, { numeric: true });
  }
  if (sortState.key === "kind") {
    return a.kind.localeCompare(b.kind, "ja") || na.localeCompare(nb, undefined, { numeric: true });
  }
  return na.localeCompare(nb, undefined, { numeric: true });
}
function sortRows() { const dir = sortState.asc ? 1 : -1; rows.sort((a, b) => cmpRow(a, b) * dir); }
function compareDirNodes(a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }) * (sortState.asc ? 1 : -1); }
function compareFileNodes(a, b) {
  const ra = a.row || { name: a.path, version: "", kind: "" };
  const rb = b.row || { name: b.path, version: "", kind: "" };
  return cmpRow(ra, rb) * (sortState.asc ? 1 : -1);
}

/* ---- 描画 ---- */
function makeFileRow(r, tree, depth) {
  const tr = document.createElement("tr");
  if (r.dim) tr.className = "dim";
  const tdName = document.createElement("td");
  tdName.className = "col-name"; tdName.title = r.name;
  const nameEl = document.createElement("span"); nameEl.className = "fname";
  if (tree) {
    tdName.style.paddingLeft = (12 + depth * 16) + "px";
    tdName.innerHTML = `<span class="tw"></span>` + iconHTML(r.app);
    nameEl.textContent = baseName(r.name);
  } else {
    tdName.innerHTML = iconHTML(r.app);
    nameEl.textContent = r.name;
  }
  tdName.appendChild(nameEl);
  const tdVer = document.createElement("td");
  tdVer.className = "col-ver";                          // バージョンは常に通常色
  const fam = verDotFamily(r.app);                      // 行頭にアプリ系統色のドット（対象ファイルのみ・版数空でも表示）
  if (fam) { const dot = document.createElement("span"); dot.className = "vdot " + fam; tdVer.appendChild(dot); }
  tdVer.appendChild(document.createTextNode(r.version));
  tdVer.title = r.version;
  const tdKind = document.createElement("td");
  tdKind.className = "col-kind" + (r.mismatch ? " mismatch" : "");   // 種類のみ赤（拡張子偽装）
  tdKind.textContent = r.kind;
  tdKind.title = r.kind + (r.warnNote || "");
  tr.append(tdName, tdVer, tdKind);
  return tr;
}
function appendDirRow(node, depth, frag) {
  const tr = document.createElement("tr"); tr.className = "dir";
  const open = expanded.has(node.path);
  const tdName = document.createElement("td"); tdName.className = "col-name";
  tdName.style.paddingLeft = (12 + depth * 16) + "px";
  tdName.innerHTML = `<span class="tw">${open ? "▼" : "▶"}</span><span class="folder-icon">📁</span>`;
  tdName.appendChild(document.createTextNode(node.name));
  const tdVer = document.createElement("td"); tdVer.className = "col-ver";
  const tdKind = document.createElement("td"); tdKind.className = "col-kind";
  tr.append(tdName, tdVer, tdKind);
  tr.addEventListener("click", () => {
    if (expanded.has(node.path)) { expanded.delete(node.path); render(); }
    else expandDir(node);
  });
  frag.appendChild(tr);
}
function renderChildren(node, depth, frag) {
  const dirs = node.children.filter(c => c.type === "dir").sort(compareDirNodes);
  const files = node.children.filter(c => c.type === "file").sort(compareFileNodes);
  for (const d of dirs) { appendDirRow(d, depth, frag); if (expanded.has(d.path)) renderChildren(d, depth + 1, frag); }
  for (const f of files) frag.appendChild(makeFileRow(f.row || pendingRow(baseName(f.path)), true, depth));
}
function countAllFiles(node) { let n = 0; for (const c of node.children) n += c.type === "file" ? 1 : countAllFiles(c); return n; }

function render() {
  tbody.classList.toggle("icons-file", iconStyle === "file");
  tbody.innerHTML = "";
  const frag = document.createDocumentFragment();
  if (treeMode && treeRoot) renderChildren(treeRoot, 0, frag);
  else { sortRows(); for (const r of rows) frag.appendChild(makeFileRow(r, false, 0)); }
  tbody.appendChild(frag);

  const total = (treeMode && treeRoot) ? countAllFiles(treeRoot) : rows.length;
  const hasTree = treeMode && treeRoot && treeRoot.children.length > 0;
  const hasContent = total > 0 || hasTree;
  placeholder.style.display = (hasContent || analyzing) ? "none" : "flex";
  btnPrint.disabled = !hasContent;
  btnClear.disabled = !hasContent;
  const hasDir = treeMode && treeRoot && treeRoot.children.some(c => c.type === "dir");
  btnExpand.disabled = !hasDir;
  btnCollapse.disabled = !hasDir;


  document.querySelectorAll("thead th").forEach(th => {
    const arrow = th.querySelector(".arrow");
    arrow.textContent = th.dataset.key === sortState.key ? (sortState.asc ? "▲" : "▼") : "";
  });
}

/* ---- 並べ替えヘッダ ---- */
document.querySelectorAll("thead th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortState.key === key) sortState.asc = !sortState.asc;
    else { sortState.key = key; sortState.asc = true; }
    render();
  });
});

/* ---- ドラッグ＆ドロップ ---- */
let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragover"); });
window.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
window.addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragover"); } });
window.addEventListener("drop", async e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragover");
  const dt = e.dataTransfer; if (!dt) return;

  // ハンドル/エントリは dt.files より先に同期取得する（DataTransfer は await 後に失効するため）。
  // ※ 同一アイテムに getAsFileSystemHandle と webkitGetAsEntry を「両方」呼ぶと、Chrome では
  //   FSA ハンドルの列挙が 0 件になることがある（実機ドロップで確認）。旧 Entries API は実機で
  //   確実に中身を返すため Entries を優先し、各アイテムに対しては片方の取得関数だけを呼ぶ。
  const handlePromises = [], entries = [];
  if (dt.items && dt.items.length) {
    for (let i = 0; i < dt.items.length; i++) {
      const it = dt.items[i]; if (!it) continue;
      if (typeof it.webkitGetAsEntry === "function") {
        const en = it.webkitGetAsEntry(); if (en) entries.push(en);
      } else if (typeof it.getAsFileSystemHandle === "function") {
        handlePromises.push(it.getAsFileSystemHandle());
      }
    }
  }
  const fallbackFiles = dt.files ? Array.from(dt.files) : [];

  let rawTop = [];
  if (entries.length) {                                     // 方式A: 旧 Entries API（実機ドロップで確実）
    rawTop = entries.map(en => nodeFromEntry(en, en.name));
  } else if (handlePromises.length) {                       // 方式B: File System Access API（Entries 非対応ブラウザ）
    const settled = await Promise.allSettled(handlePromises);
    for (const s of settled) if (s.status === "fulfilled" && s.value) rawTop.push(nodeFromFSAHandle(s.value, s.value.name));
  }

  if (rawTop.some(n => n.type === "dir")) {
    // ディレクトリを含む → 遅延ツリー（dt.files ではフォルダの中身を取得できないため Entries/FSA を使う）。
    await startTreeFromTopNodes(rawTop);
    // file:// の Chrome 等ではフォルダの中身が読めず空になる（OS/ブラウザ制限）。
    // フォルダを落としたのに1件も読めなかった場合だけ案内を出す（https/Safari では出ない）。
    // ※ Safari の file:// では readEntries が成功するため、空フォルダやサブフォルダのみの
    //   フォルダでも countAllFiles === 0 になるが、listError は立たない。
    //   Chrome の file:// 失敗は readEntries がエラーコールバックを呼ぶため listError === true
    //   になる。この差で誤警告を防ぐ。
    const topDirs = treeRoot ? treeRoot.children.filter(c => c.type === "dir") : [];
    const anyListError = topDirs.some(c => c.listError);
    if (location.protocol === "file:" && treeRoot
        && treeRoot.children.some(c => c.type === "dir") && countAllFiles(treeRoot) === 0
        && anyListError) {
      showNotice('⚠ <b>このページをダブルクリック（file://）で開いた Chrome / Edge では、フォルダのドラッグ＆ドロップに対応していません</b>（中身を 0 件として読み込みます）。'
        + '「<b>開く…</b>」→「<b>フォルダを選択</b>」をお使いください。');
    }
    return;
  }

  // ファイルのみ → dataTransfer.files を最優先で使う。
  // ※ file:// の Chrome では Entries API の entry.file() が失敗する一方、dataTransfer.files は
  //   ドロップされた「ファイル」については確実に取得できるため、こちらを使う（ディレクトリ=size0/type空は除外）。
  let files = fallbackFiles.filter(f => !(f.size === 0 && f.type === ""));
  if (!files.length && rawTop.length) {                       // dt.files が空のブラウザ向けの保険
    for (const n of rawTop) { const f = await n.getFile(); if (f) files.push(f); }
  }
  if (files.length) handleFiles(files);
});

/* ---- 「開く」メニュー（ファイル / フォルダ） ---- */
btnOpen.addEventListener("click", e => { e.stopPropagation(); openMenu.hidden = !openMenu.hidden; });
openMenu.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => { openMenu.hidden = true; });
miFile.addEventListener("click", () => { openMenu.hidden = true; fileInput.click(); });
miFolder.addEventListener("click", () => { openMenu.hidden = true; folderInput.click(); });
fileInput.addEventListener("change", () => { if (fileInput.files.length) handleFiles(fileInput.files); fileInput.value = ""; });
folderInput.addEventListener("change", () => { if (folderInput.files.length) initTree(buildEagerTree(Array.from(folderInput.files))); folderInput.value = ""; });

/* ---- ツールバー ---- */
btnIconStyle.addEventListener("click", () => {
  iconStyle = iconStyle === "badge" ? "file" : "badge";
  lsSet("afver-iconstyle", iconStyle);
  updateIconStyleBtn(); render();
});
updateIconStyleBtn();
btnExpand.addEventListener("click", expandAll);
btnCollapse.addEventListener("click", () => { expanded.clear(); render(); });
btnClear.addEventListener("click", () => {
  rows = []; treeMode = false; treeRoot = null; lastFlatFiles = null; expanded.clear(); hideNotice();
  placeholder.innerHTML = PLACEHOLDER_HTML; render();
});

/* ---- バージョン精度モード（詳細 / 簡易） ---- */
const segFull = document.getElementById("detail-full");
const segSimple = document.getElementById("detail-simple");
function updateDetailUI() {
  if (segFull) segFull.classList.toggle("active", versionDetail === "full");
  if (segSimple) segSimple.classList.toggle("active", versionDetail === "simple");
}
// 読み込み済み項目を新しい精度で再解析する（ツリーは展開中フォルダのみ＝遅延方針を維持）。
async function reanalyzeAll() {
  if (treeMode && treeRoot) {
    const reset = (n) => { for (const c of (n.children || [])) { if (c.type === "file") { c.analyzed = false; c.row = null; } else reset(c); } };
    reset(treeRoot);
    startAnalyze(); render();
    await ensureFolderAnalyzed(treeRoot);
    const redo = async (n) => { for (const c of (n.children || [])) { if (c.type === "dir" && c.loaded && expanded.has(c.path)) { await ensureFolderAnalyzed(c); await redo(c); } } };
    await redo(treeRoot);
    endAnalyze(); render();
  } else if (!treeMode && lastFlatFiles) {
    await handleFiles(lastFlatFiles);
  }
}
async function setVersionDetail(mode) {
  const m = mode === "simple" ? "simple" : "full";
  if (m === versionDetail) return;
  versionDetail = m; lsSet("afver-detail", m); updateDetailUI();
  await reanalyzeAll();
}
if (segFull) segFull.addEventListener("click", () => setVersionDetail("full"));
if (segSimple) segSimple.addEventListener("click", () => setVersionDetail("simple"));
// 初期モード決定：URL（?mode=simple / #simple、fast も可）> localStorage > 既定（詳細）
(function initDetail() {
  let m = null;
  try {
    const q = (new URLSearchParams(location.search).get("mode") || "").toLowerCase();
    const h = (location.hash || "").replace("#", "").toLowerCase();
    if (q === "simple" || q === "fast" || h === "simple" || h === "fast") m = "simple";
    else if (q === "full" || q === "detail" || h === "full" || h === "detail") m = "full";
  } catch (e) {}
  if (!m) { const saved = lsGet("afver-detail"); if (saved === "simple" || saved === "full") m = saved; }
  versionDetail = m || "full";
  updateDetailUI();
})();

/* ---- 印刷 / PDF（現在の展開状態をそのまま出力） ---- */
btnPrint.addEventListener("click", () => {
  const d = new Date();
  const ymd = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  printTitle.innerHTML = `<h2>AFVer-Web — 作成バージョン一覧</h2><div class="pt-date">${ymd}</div>`;
  window.print();
});

render();
</script>
